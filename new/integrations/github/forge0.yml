# FORGE-0 for GitHub — copy to .github/workflows/forge0.yml in the repository to protect.
#
# Triggers:
#   * a run of the workflow named in `workflows:` below fails  -> investigate, open a PR if verified
#   * an issue gets the `forge0` label                          -> investigate, open a PR if verified,
#     otherwise comment the evidence on the issue. Name the test with a line like
#     "Failing test: <test name>" in the issue body (else the first failing test is used).
#
# Requires: repository secret META_API_KEY (Meta Model API). Optional: OPENAI_COMPAT_API_KEY for
# routing experiment design and repairs to Muse Spark Open on Baseten (see AI_SECONDARY_* below),
# and FORGE0_DEPLOY_KEY (a read-only deploy key) if your FORGE-0 checkout is a private repository.
# Limits: the sandbox is offline and does not install dependencies, so the project's tests must
# run with Node's built-in runner (node --test) or with pytest and the standard library only.
name: FORGE-0

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write  # dispatch CI on the fix branch

concurrency:
  group: forge0-${{ github.event.workflow_run.head_branch || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  investigate:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'failure'
        && !startsWith(github.event.workflow_run.head_branch, 'forge0/'))
      || (github.event_name == 'issues' && github.event.label.name == 'forge0')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORGE0_REPOSITORY: waleedmustafa971/forge-0
      FORGE0_REF: main
      # Same workflow as `workflows:` above (name or file); it needs a `workflow_dispatch:` trigger.
      # It is dispatched on FORGE-0's fix branch so the PR gets checks. Empty: skip.
      CI_WORKFLOW: CI
      BASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.repository.default_branch }}
    steps:
      # Side by side, so FORGE-0's own files never become part of the snapshot it investigates.
      - name: Check out the repository under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
          fetch-depth: 0
          path: target

      - name: Check out FORGE-0
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORGE0_REPOSITORY }}
          ref: ${{ env.FORGE0_REF }}
          path: forge0
          ssh-key: ${{ secrets.FORGE0_DEPLOY_KEY }}  # empty for a public FORGE-0: the token is used
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FORGE-0 and its sandbox images
        run: |
          pip install ./forge0/backend
          docker pull node:24-alpine
          docker build -t forge0/sandbox-python:3.12 forge0/backend/sandbox/images/python

      - name: Describe the issue
        if: github.event_name == 'issues'
        env:
          # Passed through the environment, never interpolated into the script.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"

      - name: Investigate with FORGE-0
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROVIDER: meta
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_MODEL: muse-spark-1.3
          AI_MAX_TOKENS: "8192"
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_BASE_URL: https://inference.baseten.co/v1
          OPENAI_COMPAT_MODEL: meta-models/muse-spark-open-1026
          OPENAI_COMPAT_STRUCTURED_OUTPUT: json_object
          # Set to "openai" to run experiment design and repairs on Muse Spark Open.
          AI_SECONDARY_PROVIDER: ""
          AI_SECONDARY_TASKS: experiments,repair
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        working-directory: target
        run: |
          args=(--repo . --report-dir "$RUNNER_TEMP/forge0-report" --open-pr --base "$BASE_BRANCH")
          if [ -n "$ISSUE_NUMBER" ]; then
            args+=(--issue-body-file "$RUNNER_TEMP/issue.md" --comment-issue "$ISSUE_NUMBER")
          fi
          git config --global --add safe.directory "$PWD"
          forge0-ci "${args[@]}"

      # A pull request opened with the workflow's own token starts no `pull_request` workflows
      # (GitHub records a failed run with no jobs instead), so CI is dispatched on the fix branch:
      # workflow_dispatch is the one event that token may trigger.
      - name: Run CI on the fix branch
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        if: env.CI_WORKFLOW != ''
        run: |
          branch=$(git branch --show-current)
          case "$branch" in
            forge0/*) gh workflow run "$CI_WORKFLOW" --ref "$branch" && echo "Dispatched $CI_WORKFLOW on $branch" ;;
            *) echo "No fix branch: nothing to check" ;;
          esac

      - name: Upload the evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge0-evidence-report
          path: ${{ runner.temp }}/forge0-report
          if-no-files-found: ignore
